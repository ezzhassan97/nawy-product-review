<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{SHORT}} product reviews</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* nawy.com design tokens */
  :root { --navy: #1E4164; --blue: #015C9A; --blue-soft: #E8F0F7; --muted: #5B6573; --line: #E6E6E6; --soft: #F5F7FA; --side: 248px; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { display: flex; background: var(--soft); color: var(--navy); font: 400 14px/1.5 Poppins, system-ui, sans-serif; }
  .side { flex: none; width: var(--side); display: flex; flex-direction: column; background: #fff; border-right: 1px solid var(--line);
          transition: width .2s ease; overflow: hidden; }
  .side-top { height: 64px; flex: none; display: flex; align-items: center; gap: 10px; padding: 0 14px; border-bottom: 1px solid var(--line); }
  .logo svg { height: 26px; width: auto; display: block; }
  .toggle { margin-left: auto; width: 34px; height: 34px; flex: none; display: grid; place-items: center; border: 0; border-radius: 8px;
            background: none; color: var(--navy); cursor: pointer; }
  .toggle:hover { background: var(--soft); }
  .side h2 { margin: 18px 18px 6px; font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
  .list { flex: 1; overflow-y: auto; padding: 0 10px 16px; }
  .list button { width: 100%; display: flex; align-items: center; gap: 10px; margin: 2px 0; padding: 9px 10px; border: 0; border-radius: 8px;
                 background: none; color: var(--navy); font: 500 13.5px Poppins, sans-serif; text-align: left; white-space: nowrap; cursor: pointer; }
  .list button:hover { background: var(--soft); }
  .list button[aria-current="page"] { background: var(--blue-soft); color: var(--blue); font-weight: 600; }
  .list .num { flex: none; min-width: 26px; height: 22px; padding: 0 6px; display: grid; place-items: center; border-radius: 6px;
               background: var(--soft); color: var(--muted); font-size: 11px; font-weight: 600; }
  .list button[aria-current="page"] .num { background: var(--blue); color: #fff; }
  body.collapsed .side { width: 60px; }
  body.collapsed .logo, body.collapsed .side h2, body.collapsed .list .label { display: none; }
  body.collapsed .side-top { justify-content: center; padding: 0; }
  body.collapsed .toggle { margin: 0; }
  body.collapsed .list button { justify-content: center; padding: 9px 0; }
  iframe { flex: 1; min-width: 0; height: 100%; border: 0; background: #fff; }
  @media (max-width: 720px) { body:not(.collapsed) .side { position: absolute; z-index: 5; height: 100%; box-shadow: 0 8px 24px rgba(0,0,0,.12); } }

  /* The landing cover: what the link opens on; "See reviews" reveals the menu and the reviews behind it */
  .landing { position: fixed; inset: 0; z-index: 10; display: flex; align-items: center; gap: 4vw; padding: 6vh 7vw; background: var(--navy);
             color: #fff; transition: opacity .45s ease, visibility .45s; }
  body.entered .landing { opacity: 0; visibility: hidden; }
  .landing .text { flex: 1.1; max-width: 760px; }
  .landing .badge-logo { display: inline-flex; margin-bottom: 40px; padding: 14px 22px; border-radius: 14px; background: #fff; }
  .landing .badge-logo svg { height: 36px; width: auto; display: block; }
  .landing .kicker { margin: 0 0 14px; font-size: 14px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: #7DCBC1; }
  .landing h1 { margin: 0; font-size: clamp(40px, 6.2vw, 92px); line-height: 1.05; font-weight: 700; letter-spacing: -.01em; }
  .landing .lead { margin: 20px 0 0; font-size: clamp(17px, 1.7vw, 26px); color: #C9D6E3; }
  .landing .tags { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 28px; }
  .landing .tags span { padding: 7px 16px; border-radius: 10px; background: rgba(255,255,255,.1); font-size: 15px; font-weight: 500; }
  .landing .cta { display: inline-flex; align-items: center; gap: 10px; margin-top: 40px; padding: 15px 30px; border: 0; border-radius: 10px;
                  background: #fff; color: var(--navy); font: 600 17px Poppins, sans-serif; cursor: pointer; transition: transform .15s ease, box-shadow .15s ease; }
  .landing .cta:hover { transform: translateY(-2px); box-shadow: 0 10px 24px rgba(0,0,0,.25); }
  .landing .cover-visual { flex: 1; min-width: 0; }
  .landing .cover-visual svg { width: 100%; height: auto; max-height: 72vh; display: block; }
  .side .logo { cursor: pointer; }
  @media (max-width: 820px) { .landing .cover-visual { display: none; } }
</style>
</head>
<body>
<section class="landing" id="landing" aria-label="{{SHORT}} product reviews">
  <div class="text">
    <span class="badge-logo"></span>
    <p class="kicker">{{SHORT}} product reviews</p>
    <h1>{{PRODUCT}}</h1>
    <p class="lead">{{TAGLINE}}</p>
    <div class="tags"><span>{{PRESENTER}}</span><span id="latest"></span></div>
    <button class="cta" id="enter" type="button">See reviews <span aria-hidden="true">→</span></button>
  </div>
  <div class="cover-visual"></div>
</section>
<aside class="side" aria-label="Product reviews">
  <div class="side-top">

    <button class="toggle" id="toggle" type="button" aria-label="Collapse the menu" aria-expanded="true">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
  </div>
  <h2>{{SHORT}} product reviews</h2>
  <nav class="list" id="list"></nav>
</aside>
<iframe id="view" title="Product review" allow="fullscreen" allowfullscreen></iframe>
<script>
  // Every review, oldest first; the latest opens by default. The product-review skill adds one line per review:
  // { id: '2026-10-05-week-1', label: '5th OCT, 2026 - Week 1', short: 'W1', src: 'reviews/2026-10-05-week-1/index.html' }
  // and setup puts past reviews first when there is a PDF:
  // { id: 'before-5th-oct-2026', label: 'Before 5th OCT, 2026', short: 'Pre', src: 'history/past-reviews.pdf#view=FitH' }
  const REVIEWS = [
  ];

  const list = document.getElementById('list');
  const view = document.getElementById('view');
  const toggle = document.getElementById('toggle');
  const store = { get: (k) => { try { return localStorage.getItem(k); } catch { return null; } },
                  set: (k, v) => { try { localStorage.setItem(k, v); } catch {} } };
  const collapse = (on) => {
    document.body.classList.toggle('collapsed', on);
    toggle.setAttribute('aria-expanded', !on);
    toggle.setAttribute('aria-label', on ? 'Open the menu' : 'Collapse the menu');
    store.set('product-review:collapsed', on ? '1' : '0');
  };
  toggle.addEventListener('click', () => collapse(!document.body.classList.contains('collapsed')));
  collapse(store.get('product-review:collapsed') === '1');

  const entered = () => document.body.classList.contains('entered');
  view.addEventListener('load', () => entered() && view.focus()); // arrow keys drive the slides without a click first

  let current;
  const show = (id) => {
    const review = REVIEWS.find((r) => r.id === id) ?? REVIEWS[REVIEWS.length - 1];
    if (!review) return; // no review yet
    current = review.id;
    if (!view.src.endsWith(review.src)) view.src = review.src;
    [...list.children].forEach((b) => {
      const active = b.dataset.id === review.id;
      active ? b.setAttribute('aria-current', 'page') : b.removeAttribute('aria-current');
      if (active) b.scrollIntoView({ block: 'nearest' });
    });
    if (entered()) history.replaceState(null, '', '#' + review.id);
  };
  REVIEWS.forEach((r) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.dataset.id = r.id;
    b.title = r.label;
    b.innerHTML = `<span class="num"></span><span class="label"></span>`;
    b.querySelector('.num').textContent = r.short;
    b.querySelector('.label').textContent = r.label;
    b.addEventListener('click', () => show(r.id));
    list.append(b);
  });
  show(location.hash.slice(1)); // loads behind the cover, so "See reviews" opens instantly

  // The cover: the link lands on it; a link to a review ("#<id>") goes straight to that review.
  const landing = document.getElementById('landing');
  landing.querySelector('.badge-logo').append(document.querySelector('.side .logo svg').cloneNode(true));
  document.getElementById('latest').textContent = REVIEWS.length ? 'Latest: ' + REVIEWS[REVIEWS.length - 1].label : '';
  const enter = () => { document.body.classList.add('entered'); show(current); view.focus(); };
  document.getElementById('enter').addEventListener('click', enter);
  document.querySelector('.side .logo').addEventListener('click', () => {
    document.body.classList.remove('entered');
    history.replaceState(null, '', location.pathname);
  });
  if (location.hash) enter();
</script>
<script src="shared/cover-visual.js"></script>
</body>
</html>
